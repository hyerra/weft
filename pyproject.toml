[project]
name = "weft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harish Yerra", email = "hyerra@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "triton>=3.7.1 ; sys_platform == 'linux'",
]

[project.scripts]
weft = "weft:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "modal>=1.5.4",
]
